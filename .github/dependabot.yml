version: 2

# Monthly and grouped on purpose: every bump is a diff somebody must actually
# read, and an unread dependency bump is how a supply-chain problem arrives
# politely. Security updates are separate (repository setting) and arrive
# immediately, ungrouped, against the default branch — a real advisory never
# waits for the monthly batch.
#
# No `target-branch`: development is the default branch, where both version
# and security updates land anyway — and GitHub stops applying an entry's
# settings (the commit-message prefix, the labels) to security-update PRs once
# that entry sets `target-branch`, which leaves them outside the title grammar.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    cooldown: { default-days: 7 } # let a bad release be yanked before you take it
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(repo)" # the title grammar's type(scope); the labeler adds [—]
    labels: ["type: chore", "area: repo", "meta: dependencies"]
    assignees: ["OmarSweiti"] # the maintainer; CODEOWNERS already requests the review
    # Split patch from minor: one group is atomic, and one bump that can never
    # go green would strand every other update in it for a month.
    groups:
      actions-patch:
        applies-to: version-updates
        update-types: ["patch"]
      actions-minor:
        applies-to: version-updates
        update-types: ["minor"]

  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(repo)"
    labels: ["type: chore", "area: repo", "meta: dependencies"]
    assignees: ["OmarSweiti"]
    groups:
      npm-patch:
        applies-to: version-updates
        update-types: ["patch"]
      npm-minor:
        applies-to: version-updates
        update-types: ["minor"]
    ignore:
      # A major that can never pass your pins only manufactures red PRs. Move
      # it deliberately, with the runtime it depends on, in one change: the
      # Node types follow .nvmrc, and React's types follow react itself.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # A TypeScript major needs the toolchain to support it first: TypeScript 7
      # fails the lint gate with "typescript-eslint does not support TS 7.0"
      # (#28). Move it deliberately once typescript-eslint and Next.js support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 waits for the plugins eslint-config-next bundles: today
      # eslint-plugin-react still calls context.getFilename(), which ESLint 10
      # removed (#26). Move it with eslint-config-next, deliberately.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/*"
        update-types: ["version-update:semver-major"]
